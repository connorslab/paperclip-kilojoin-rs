[package]
name = "paperclip-kilojoin"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT AND Apache-2.0"
description = "Experimental Kilojoin v1 protocol, crypto, and durable round state for the XBT BLAKE2b chain"
repository = "https://github.com/connorslab/paperclip-kilojoin-rs"
readme = "README.md"
keywords = ["coinjoin", "nostr", "kilojoin", "xbt"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bitcoin = { version = "0.32.9", features = ["serde", "rand-std"] }
chacha20 = "0.9.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
